name: inference-bench

# Runs are started by an outside scheduler (cron-job.org) calling GitHub's
# "run workflow" API every 30 minutes, at :00 and :30. Those start within seconds;
# GitHub's own schedule drifts by hours, which would leave uneven gaps in the data.
# There's deliberately no GitHub schedule as a backup: a late backup run would
# double-sample that half hour. cron-job.org failure emails cover missed calls.
on:
  workflow_dispatch:
    inputs:
      long:
        description: "Force the long-context test this run"
        type: boolean
        default: false
      only:
        description: "Comma-separated providers (blank = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: inference-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Check out results branch
        uses: actions/checkout@v6
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run benchmark
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ARGS="--out-dir data/results"
          if [ "${{ inputs.long }}" = "true" ]; then ARGS="$ARGS --long"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python bench/run.py $ARGS

      - name: Commit results to data branch
        working-directory: data
        run: |
          git config user.name "bench-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: run ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin data && git push origin HEAD:data && exit 0
            sleep 5
          done
          exit 1
